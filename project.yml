name: MarkReader
options:
  bundleIdPrefix: com.yutonglv
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  cmark:
    url: https://github.com/swiftlang/swift-cmark
    from: "0.5.0"
targets:
  MarkReader:
    type: application
    platform: iOS
    sources:
      - MarkReader/Sources
      - path: MarkReader/Resources
        buildPhase: resources
      - path: MarkReader/Assets.xcassets
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
    info:
      path: MarkReader/Info.plist
      properties:
        CFBundleDisplayName: Inkdown
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.yutonglv.inkdown
        PRODUCT_NAME: Inkdown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MarkReaderMac:
    type: application
    platform: macOS
    sources:
      - MarkReader/Sources
      - path: MarkReader/Resources
        buildPhase: resources
      - path: MarkReader/Assets.xcassets
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
    info:
      path: MarkReader/Info-macOS.plist
      properties:
        CFBundleDisplayName: Inkdown
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.yutonglv.inkdown
        PRODUCT_NAME: Inkdown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
